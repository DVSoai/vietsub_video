name: bili-probe
on:
  push:
    branches: [feat/bilibili-browse]
    paths: [tests/probe/**, app/bilibili.py, .github/workflows/bili-probe.yml]
jobs:
  probe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - run: python tests/probe/probe_browse_live.py
