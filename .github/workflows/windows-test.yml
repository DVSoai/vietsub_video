name: windows-test
on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, PySide6; print(sys.version, PySide6.__version__)"
          python -c "import PySide6.QtWebEngineWidgets; print('QtWebEngine OK')"
      - name: Mo roi dong app ngay (12 lan)
        shell: cmd
        run: |
          set FAIL=0
          for /L %%i in (1,1,12) do (
            python tests/win_close_check.py . plain >NUL 2>NUL && (echo mo_dong_app lan %%i: 0) || (echo mo_dong_app lan %%i: LOI & set FAIL=1)
          )
          exit /b %FAIL%
      - name: Dong app khi luong nen con chay (6 lan)
        if: always()
        shell: cmd
        run: |
          set FAIL=0
          for /L %%i in (1,1,6) do (
            python tests/test_close_while_busy.py > out.txt
            type out.txt | findstr /C:"2/2 PASS" >NUL || set FAIL=1
            type out.txt | findstr /B "["
          )
          exit /b %FAIL%
      - name: test_ai_connect (DPAPI that tren Windows)
        if: always()
        run: python tests/run_check.py tests/test_ai_connect.py
      - name: test_retired_models (model bị nhà cung cấp tắt)
        if: always()
        run: python tests/run_check.py tests/test_retired_models.py
      - name: test_bilibili_browse (duyệt theo mục, máy chủ giả lập)
        if: always()
        run: python tests/run_check.py tests/test_bilibili_browse.py
      - name: test_bili_subs_queue (phụ đề Bilibili, tạm dừng / bỏ phim trong hàng chờ)
        if: always()
        run: python tests/run_check.py tests/test_bili_subs_queue.py
      - name: test_ui_redesign (điều hướng, cắt video, sửa phụ đề, tự động từ link)
        if: always()
        run: python tests/run_check.py tests/test_ui_redesign.py
      - name: test_browse_no_crash (đổi mục liên tục khi đang dịch tiêu đề)
        if: always()
        run: python tests/run_check.py tests/test_browse_no_crash.py
      - name: test_download_queue (khung Hàng chờ tải 1366x768)
        if: always()
        run: python tests/run_check.py tests/test_download_queue.py
      - name: test_free_keys_dialog
        if: always()
        run: python tests/run_check.py tests/test_free_keys_dialog.py
      - name: test_free_providers
        if: always()
        run: python tests/run_check.py tests/test_free_providers.py
      - name: test_translation_quality
        if: always()
        run: python tests/run_check.py tests/test_translation_quality.py
      - name: Anh giao dien
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-windows
          path: tests/qa_data/*.png
