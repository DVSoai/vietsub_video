name: windows-test
on:
  push:
    branches: [ci/windows-test-ai-connect]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, PySide6; print(sys.version, PySide6.__version__)"
          python -c "import PySide6.QtWebEngineWidgets; print('QtWebEngine OK')"
      - name: Chan doan ma thoat
        shell: cmd
        run: |
          python -c "import os; os._exit(0)"
          echo plain_os_exit=%ERRORLEVEL%
          python -c "import os,sys; os.environ['QT_QPA_PLATFORM']='offscreen'; from PySide6.QtWidgets import QApplication; a=QApplication(sys.argv); os._exit(0)"
          echo qt_os_exit=%ERRORLEVEL%
          python -c "import os,sys,threading,time; os.environ['QT_QPA_PLATFORM']='offscreen'; from PySide6.QtWidgets import QApplication; from http.server import ThreadingHTTPServer,BaseHTTPRequestHandler; s=ThreadingHTTPServer(('127.0.0.1',0),BaseHTTPRequestHandler); threading.Thread(target=s.serve_forever,daemon=True).start(); a=QApplication(sys.argv); os._exit(0)"
          echo qt_server_os_exit=%ERRORLEVEL%
          python tests/test_ai_connect.py > NUL 2> err.txt
          echo test_ai_connect=%ERRORLEVEL%
          type err.txt
          git fetch --depth=1 origin 45e26416d55416cedc5ce12aa88c254f4d60f1e7
          git worktree add main_ver FETCH_HEAD
          python tests/win_close_check.py main_ver plain
          echo MAIN_mo_dong_app=%ERRORLEVEL%
          python tests/win_close_check.py main_ver dialog
          echo MAIN_mo_dong_app_co_hop_thoai=%ERRORLEVEL%
          python tests/win_close_check.py . plain
          echo NHANH_mo_dong_app=%ERRORLEVEL%
          python tests/win_close_check.py . dialog
          echo NHANH_mo_dong_app_co_hop_thoai=%ERRORLEVEL%
          type %TEMP%\closecheck_plain\settings.json
          exit /b 0
      - name: test_ai_connect (DPAPI that tren Windows)
        run: python tests/test_ai_connect.py
      - name: test_free_keys_dialog
        if: always()
        run: python tests/test_free_keys_dialog.py
      - name: test_free_providers
        if: always()
        run: python tests/test_free_providers.py
      - name: test_translation_quality
        if: always()
        run: python tests/test_translation_quality.py
      - name: Anh giao dien
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-windows
          path: tests/qa_data/*.png
