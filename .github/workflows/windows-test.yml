name: windows-test
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, PySide6; print(sys.version, PySide6.__version__)"
          python -c "import PySide6.QtWebEngineWidgets; print('QtWebEngine OK')"
      - name: Mo/dong app binh thuong
        shell: cmd
        run: |
          for /L %%i in (1,1,6) do (
            python tests/win_close_check.py . dialog
            call echo mo_dong_app lan %%i = %%ERRORLEVEL%%
            if not errorlevel 0 exit /b 1
            if errorlevel 1 exit /b 1
          )
      - name: test_ai_connect (DPAPI that tren Windows)
        if: always()
        run: python tests/run_check.py tests/test_ai_connect.py
      - name: test_free_keys_dialog
        if: always()
        run: python tests/run_check.py tests/test_free_keys_dialog.py
      - name: test_free_providers
        if: always()
        run: python tests/run_check.py tests/test_free_providers.py
      - name: test_translation_quality
        if: always()
        run: python tests/run_check.py tests/test_translation_quality.py
      - name: Anh giao dien
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-windows
          path: tests/qa_data/*.png
