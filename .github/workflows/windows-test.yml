name: windows-test
on:
  push:
    branches: [ci/windows-test-ai-connect]
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, PySide6; print(sys.version, PySide6.__version__)"
          python -c "import PySide6.QtWebEngineWidgets; print('QtWebEngine OK')"
      - name: test_ai_connect (DPAPI that tren Windows)
        run: python tests/test_ai_connect.py
      - name: test_free_keys_dialog
        if: always()
        run: python tests/test_free_keys_dialog.py
      - name: test_free_providers
        if: always()
        run: python tests/test_free_providers.py
      - name: test_translation_quality
        if: always()
        run: python tests/test_translation_quality.py
      - name: Anh giao dien
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anh-windows
          path: tests/qa_data/*.png
